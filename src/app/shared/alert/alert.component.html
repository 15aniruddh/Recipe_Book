<div class="backdrop" (click)="onClose()">
    <div class="alert-box" (click)="$event.stopPropagation()">
        <div class="alert-icon"><i class="bi bi-exclamation-circle"></i></div>
        <p class="alert-message">{{ message }}</p>
        <button class="pill-btn primary alert-close" (click)="onClose()">Got it</button>
    </div>
</div>
