<form (ngSubmit)="onSubmit(f)" #f="ngForm" class="shopping-edit-form">
  <div class="edit-fields">
    <div class="form-group">
      <label>Name</label>
      <input type="text" class="text-input" name="name" ngModel required>
    </div>
    <div class="form-group amount-group">
      <label>Amount</label>
      <input type="number" class="text-input" name="amount" ngModel required pattern="^[1-9]+[0-9]*$">
    </div>
  </div>

  <div class="edit-actions">
    <button class="pill-btn primary" type="submit" [disabled]="!f.valid">{{ editMode ? 'Update' : 'Add'}}</button>
    <button class="pill-btn light" type="button" (click)="onDelete()" *ngIf="editMode">Delete</button>
    <button class="pill-btn light" type="button" (click)="onClear()">Clear</button>
  </div>
</form>
