<div class="auth-hero">
  <div class="auth-logo">
    <i class="bi bi-egg-fried"></i>
  </div>

  <div class="auth-heading">
    <p>Welcome to</p>
    <h1>Recipe Book</h1>
  </div>

  <app-alert [message]="error" *ngIf="error" (close)="onHandleError()"></app-alert>
  <app-alert [message]="info" *ngIf="info" (close)="onHandleInfo()"></app-alert>

  <div class="text-center" *ngIf="isLoading">
    <div class="spinner-border text-light" style="width: 4rem; height: 4rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)" *ngIf="!isLoading" class="auth-form">
    <div class="reason-banner" *ngIf="reason === 'save-recipe'">
      <i class="bi bi-info-circle"></i>
      Create an account or log in to save your recipe.
    </div>

    <input type="text" class="auth-input" placeholder="Email" ngModel name="email" required email>
    <input type="password" class="auth-input" placeholder="Password" ngModel name="password" required minlength="6">

    <div class="forgot-row" *ngIf="isLoginMode">
      <a (click)="onForgotPassword()">Forgot password?</a>
    </div>

    <button class="pill-btn light auth-submit" type="submit" [disabled]="!authForm.valid">
      {{ isLoginMode ? 'Login' : 'Sign Up' }}
    </button>

    <p class="login-with">or</p>

    <div class="social-row">
      <div #googleBtn class="google-btn-container" aria-label="Login with Google"></div>
    </div>

    <div class="switch-row">
      <span>{{ isLoginMode ? "Don't have an account?" : 'Already have an account?' }}</span>
      <button type="button" class="switch-btn" (click)="onSwitchMode()">
        {{ isLoginMode ? 'Create an account' : 'Login' }}
      </button>
    </div>
  </form>
</div>
